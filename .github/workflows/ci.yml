name: CI

# Re-register this workflow on GitHub (was showing stale "deleted" state)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend (cargo test + check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install frontend dependencies (tauri build script)
        run: npm ci --no-audit --no-fund

      - name: Run backend tests
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: cargo test --workspace

      - name: Check backend compiles
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: cargo check --workspace
