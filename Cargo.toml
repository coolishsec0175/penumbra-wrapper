[workspace]
resolver = "3"
members = [
    "penumbra-core/core",
    "penumbra-core/core/penumbra-macros",
    "src-tauri",
    "src-tauri/mtk-scatter-parser",
]

[workspace.package]
edition = "2024"
version = "1.1.0"
license = "AGPL-3.0-or-later"
authors = ["Shomy <shomy@shomy.is-a.dev>"]
homepage = "https://penumbra.itssho.my"
repository = "https://github.com/shomykohai/penumbra"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
