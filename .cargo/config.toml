# Windows GNU (MinGW) dlltool fails on paths containing spaces (this repo lives
# under "C:\Users\My PC\..."). Redirect the cargo target dir to a space-free path
# so build-time import-library generation (windows-link) and GCC linking work.
[build]
target-dir = "C:\\Users\\MYPC~1\\AppData\\Local\\penumbra-wrapper-target"
